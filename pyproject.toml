[project]
name = "agenda-saas"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic[email]>=2.8", "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.32", "asyncpg>=0.29", "alembic>=1.13",
  "celery[redis]>=5.4", "redis>=5.0", "argon2-cffi>=23.1", "pyjwt>=2.9",
  "cryptography>=43", "pyotp>=2.9", "openpyxl>=3.1", "anthropic>=1.0", "reportlab>=4.2", "psycopg[binary]>=3.2", "httpx>=0.27", "python-json-logger>=3.1",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["B008", "S101", "E501"]  # B008: Depends() es el idioma de FastAPI; S101: assert en tests
[tool.ruff.lint.per-file-ignores]
# En pruebas hay contraseñas/secretos de mentira, SQL armado a propósito y subprocesos controlados.
"tests/*" = ["S101", "S105", "S106", "S108", "S603", "S607", "S608", "E741", "B011"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

# Librerías sin tipos publicados: se ignoran SOLO ellas (el resto del código sigue en modo estricto).
[[tool.mypy.overrides]]
module = ["openpyxl.*", "reportlab.*", "celery.*", "pyotp.*", "redis.*"]
ignore_missing_imports = true

# Las tareas de Celery se decoran con `@celery_app.task` (Celery no publica tipos).
[[tool.mypy.overrides]]
module = ["app.workers.tasks"]
disallow_untyped_decorators = false
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
