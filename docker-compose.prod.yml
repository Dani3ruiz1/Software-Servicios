# PRODUCCIÓN (una sola máquina). Uso:
#   cp .env.production.example .env        # y completa TODOS los valores
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml run --rm migrate          # crea el esquema y el catálogo (una vez, y en cada actualización)
#   docker compose -f docker-compose.prod.yml run --rm api python -m app.scripts.create_superadmin tu@correo.com "Tu Nombre"
#   docker compose -f docker-compose.prod.yml up -d
#
# La base de datos NO está aquí: usa PostgreSQL 16 administrado (recomendado: respaldos y alta disponibilidad resueltos).
# Si quieres Postgres en la misma máquina:  docker compose -f docker-compose.prod.yml --profile localdb up -d
# (entonces DATABASE_URL apunta a postgres:5432 y tú te encargas de los respaldos: ver docs/OPERACION.md).
# NO PROBADO en esta máquina (Docker no estaba disponible al construirlo): revisa con `docker compose -f docker-compose.prod.yml config`.

x-app: &app
  build: { context: ., args: { INSTALL_DEV: "false" } }
  env_file: .env
  restart: unless-stopped
  networks: [internal]
  depends_on:
    redis: { condition: service_healthy }

services:
  caddy:                         # HTTPS automático (Let's Encrypt) + tope de tamaño de petición
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: { API_DOMAIN: "${API_DOMAIN:?define API_DOMAIN en .env}" }
    volumes: ["./deploy/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    networks: [internal, default]
    depends_on: [api]

  api:
    <<: *app
    environment: { FORWARDED_ALLOW_IPS: "*" }          # la API solo es alcanzable desde la red interna (Caddy): ahí es seguro confiar en X-Forwarded-For
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 40s
    deploy: { resources: { limits: { memory: 768M } } }

  worker:
    <<: *app
    command: celery -A app.workers.celery_app worker -l info --concurrency 2 --max-tasks-per-child 200
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME | grep -q pong"]
      interval: 60s
      timeout: 15s
    deploy: { resources: { limits: { memory: 768M } } }

  beat:                          # EXACTAMENTE UNA instancia: si hay dos, las tareas programadas se duplican
    <<: *app
    command: celery -A app.workers.celery_app beat -l info --schedule /tmp/celerybeat-schedule

  migrate:                       # tarea puntual: usa el usuario ADMINISTRADOR de la BD (crea tablas y el rol de la API)
    <<: *app
    profiles: ["tools"]
    restart: "no"
    command: sh scripts/init_db.sh

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes: ["redisdata:/data"]
    networks: [internal]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 3s, retries: 5 }

  postgres:                      # SOLO con --profile localdb
    image: postgres:16
    profiles: ["localdb"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agenda}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    networks: [internal]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d ${POSTGRES_DB:-agenda}"], interval: 10s, timeout: 5s, retries: 10 }

networks:
  internal: {}
volumes: { redisdata: {}, caddy_data: {}, caddy_config: {}, pgdata: {} }
